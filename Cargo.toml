[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/daemon",
    "crates/mcp",
    "crates/core",
    "crates/db",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["SDI contributors"]
repository = "https://github.com/scenario-driven/sdi-plugin"
homepage = "https://github.com/scenario-driven/sdi-plugin"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
# Internal
sdi-core = { path = "crates/core" }
sdi-db = { path = "crates/db" }
sdi-mcp = { path = "crates/mcp" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "process", "signal", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"

# HTTP
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
reqwest = { version = "0.12", features = ["json", "stream"], default-features = false }

# SQLite
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json", "blob"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
thiserror = "1"
anyhow = "1"

# IDs / Time
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Paths
dirs = "5"

# Misc
once_cell = "1"
slug = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
